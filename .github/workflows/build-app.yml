name: Build send to ECR

on:
  push:
    branches: [ "main" ]

env:
  PYENV: PROD
  IMAGE_TAG: "latest"
  IMAGE_NAME: "app-urbanfood"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY_APP: ${{ secrets.ECR_REPOSITORY_APP }}

permissions:
    id-token: write
    contents: read
    packages: write
    attestations: write

jobs:
  build_app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Config AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          audience: sts.amazonaws.com
          role-to-assume: arn:aws:iam::857378965163:role/github-actions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --no-cache --progress=plain -f devops/Dockerfile-App --build-arg PYENV="$PYENV" --build-arg APP_FOLDER=app/ -t  $ECR_REGISTRY/$ECR_REPOSITORY_APP:$IMAGE_TAG .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_APP:$IMAGE_TAG" > imageName.txt
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_APP:$IMAGE_TAG

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: ECRImageName
          path: "imageName.txt"
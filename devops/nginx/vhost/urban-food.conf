upstream webapi {
    server backend:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
	listen 80;
	#listen 443 ssl;

	server_name localhost urbanfood.local urbanfood.intranet *.urbanfood.intranet;

	#ssl_certificate /etc/nginx/ssl.crt/STAR.urbanfood.intranet.crt;
	#ssl_certificate_key /etc/nginx/ssl.key/STAR.urbanfood.intranet.key;

	access_log  /dev/stdout main;
	error_log   /dev/stdout warn;	  

	location / {
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;

		proxy_http_version 1.1;
		proxy_read_timeout 28800;         
		proxy_redirect     off;

		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_cache_bypass $http_upgrade;

		proxy_pass http://webapi;
	}

	location /static/ {
		rewrite ^/static/(.*)$ /$1 break;
		root /usr/share/nginx/static;
	}
	
    location /(probe|health) {
      add_header Cache-Control private;
      expires 65s;

      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;

      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_pass http://webapi;
    }	
  
}
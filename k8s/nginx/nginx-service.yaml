apiVersion: v1
kind: Service
metadata:
  name: service-nginx-urbanfood
  namespace: urbanfood
spec:
  ports:
  - name: service-nginx-http
    port: 80 
    protocol: TCP
    targetPort: 8080
  - name: service-nginx-https
    port: 443
    protocol: TCP
    targetPort: 8443
  selector:
    web: nginx-urbanfood
  type: LoadBalancer
  
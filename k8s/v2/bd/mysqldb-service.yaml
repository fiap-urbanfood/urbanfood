apiVersion: v1
kind: Service
metadata:
  labels:
    run: mysqldb
    kubernetes.io/cluster-service: "true"
    kubernetes.io/name: CoreDNS
  name: mysql-loadbalancer-svc
  namespace: urban-food
spec:
  ports:
  - port: 3306
    protocol: TCP
    targetPort: 3306
  selector:
    run: mysqldb
  type: ClusterIP